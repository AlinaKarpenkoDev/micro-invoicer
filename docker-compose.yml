services:
  postgres:
    image: postgres:16-alpine
    container_name: micro_invoicer_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: invoicer_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: micro_invoicer_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
    name: micro_invoicer_pg_data